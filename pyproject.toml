[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp4-downloader"
version = "1.1.0"
description = "Videos per Link als MP4 oder MP3 herunterladen (yt-dlp)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.6.9",
    "playwright>=1.40",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6",
]

[project.scripts]
vd = "vd_cli:main"

[project.gui-scripts]
vd-gui = "mp4_downloader:main"

[tool.setuptools]
py-modules = ["browser_login", "mp4_downloader", "page_extractor", "run", "vd_cli"]
