[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp4-downloader"
version = "2.3.0"
description = "Download videos from a link as MP4 or MP3 (yt-dlp)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.6.9",
    "playwright>=1.40",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6",
]

[project.scripts]
vd = "vd_cli:main"

[project.gui-scripts]
vd-gui = "mp4_downloader:main"

[tool.setuptools]
py-modules = ["app_icon", "browser_login", "browsers", "cookie_import", "i18n", "mp4_downloader", "page_extractor", "run", "site_auth", "vd_cli"]
