name: GUI release builds

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [pyproject.toml, ".github/release-notes/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # On pushes to main: create the release automatically when the version in
  # pyproject.toml has no release yet. Releases created with GITHUB_TOKEN do
  # not trigger the "release" event, so the builds below run in this workflow.
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release for new version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes_file=".github/release-notes/${tag}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build-gui:
    name: Build ${{ matrix.label }} GUI
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact_name: mp4-downloader-windows
            asset_path: dist/mp4-downloader.exe
            release_name: mp4-downloader.exe
          - os: ubuntu-latest
            label: Linux
            artifact_name: mp4-downloader-linux
            asset_path: dist/mp4-downloader
            release_name: mp4-downloader-linux
          - os: macos-latest
            label: macOS
            artifact_name: mp4-downloader-macos
            asset_path: dist/mp4-downloader
            release_name: mp4-downloader-macos

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller -r requirements.txt

      - name: Build Windows GUI executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --onefile --windowed --name mp4-downloader run.py

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Build Windows GUI setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          $env:APP_VERSION = $version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer-windows.iss

      - name: Build Linux GUI executable
        if: runner.os == 'Linux'
        run: python -m PyInstaller --onefile --name mp4-downloader run.py

      - name: Build macOS GUI executable
        if: runner.os == 'macOS'
        run: python -m PyInstaller --onefile --name mp4-downloader run.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_path }}

      - name: Rename release asset
        if: needs.prepare-release.outputs.tag != ''
        shell: bash
        run: |
          if [ "${{ matrix.asset_path }}" != "dist/${{ matrix.release_name }}" ]; then
            mv "${{ matrix.asset_path }}" "dist/${{ matrix.release_name }}"
          fi

      - name: Attach executable to release
        if: needs.prepare-release.outputs.tag != '' && runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "dist/${{ matrix.release_name }}" --clobber

      - name: Attach Windows setup to release
        if: needs.prepare-release.outputs.tag != '' && runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "dist/mp4-downloader-setup.exe" --clobber
