name: Release builds

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [pyproject.toml, ".github/release-notes/**"]
  # Pull requests build and test everything, but publish nothing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # On pushes to main: create the release automatically when the version in
  # pyproject.toml has no release yet. Releases created with GITHUB_TOKEN do
  # not trigger the "release" event, so the builds below run in this workflow.
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release for new version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            release)
              echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            workflow_dispatch|pull_request)
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes_file=".github/release-notes/${tag}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./build-windows.ps1

      - name: Test installer (install, vd, uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:LOCALAPPDATA "Programs\mp4-downloader"
          $p = Start-Process dist\mp4-downloader-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exit code $($p.ExitCode)" }
          if (-not (Test-Path "$app\vd.exe")) { throw "vd.exe fehlt" }
          if (-not (Test-Path "$app\mp4-downloader.exe")) { throw "GUI fehlt" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ";") -notcontains $app) { throw "vd nicht im PATH: $userPath" }
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Where-Object { $_.GetValue("DisplayName") -eq "Video-Downloader" }
          if (-not $key) { throw "Kein Eintrag unter Apps" }
          Write-Host "Apps-Eintrag: $($key.GetValue('DisplayName')) $($key.GetValue('DisplayVersion'))"
          $start = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Video-Downloader\Video-Downloader.lnk"
          if (-not (Test-Path $start)) { throw "Startmenü-Eintrag fehlt" }
          & "$app\vd.exe" --version
          & "$app\vd.exe" selftest
          if ($LASTEXITCODE -ne 0) { throw "vd selftest fehlgeschlagen" }
          $p = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\vd.exe") { throw "Deinstallation hat vd.exe nicht entfernt" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ";") -contains $app) { throw "PATH-Eintrag nicht entfernt" }
          Write-Host "Installer-Test erfolgreich."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp4-downloader-setup
          path: dist/mp4-downloader-setup.exe

      - name: Attach installer to release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "dist/mp4-downloader-setup.exe" --clobber

  unix:
    name: Build ${{ matrix.label }} app
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            release_name: mp4-downloader-linux
          - os: macos-latest
            label: macOS
            release_name: mp4-downloader-macos
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build app
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller -r requirements.txt
          python -m PyInstaller --onefile --name mp4-downloader run.py
          mv dist/mp4-downloader "dist/${{ matrix.release_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.release_name }}
          path: dist/${{ matrix.release_name }}

      - name: Attach app to release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "dist/${{ matrix.release_name }}" --clobber
