name: Release builds

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [pyproject.toml, ".github/release-notes/**"]
  # Pull requests build and test everything, but publish nothing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # On pushes to main: create the release automatically when the version in
  # pyproject.toml has no release yet. Releases created with GITHUB_TOKEN do
  # not trigger the "release" event, so the builds below run in this workflow.
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release for new version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          case "${{ github.event_name }}" in
            release)
              echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            workflow_dispatch|pull_request)
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes_file=".github/release-notes/${tag}.md"
          if [ -f "$notes_file" ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes_file"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: ./build-windows.ps1

      - name: Test installer (install, vd, Apps entry)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:LOCALAPPDATA "Programs\mp4-downloader"
          $p = Start-Process dist\mp4-downloader-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup exit code $($p.ExitCode)" }
          if (-not (Test-Path "$app\vd.exe")) { throw "vd.exe missing" }
          if (-not (Test-Path "$app\mp4-downloader.exe")) { throw "window app missing" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ";") -notcontains $app) { throw "vd not in PATH: $userPath" }
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Where-Object { $_.GetValue("DisplayName") -eq "Video Downloader" }
          if (-not $key) { throw "No entry under Apps" }
          Write-Host "Apps entry: $($key.GetValue('DisplayName')) $($key.GetValue('DisplayVersion'))"
          $start = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Video Downloader\Video Downloader.lnk"
          if (-not (Test-Path $start)) { throw "Start menu entry missing" }
          & "$app\vd.exe" --version
          & "$app\vd.exe" selftest
          if ($LASTEXITCODE -ne 0) { throw "vd selftest failed" }

      - name: Screenshots of the window app
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\mp4-downloader"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force screenshots | Out-Null
          function Shot([string]$Name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("screenshots\$Name.png")
          }
          foreach ($lang in @("en", "de")) {
            & "$app\vd.exe" settings --language $lang | Out-Null
            $gui = Start-Process "$app\mp4-downloader.exe" -PassThru
            Start-Sleep -Seconds 10
            Shot "gui-$lang"
            Stop-Process -Id $gui.Id -Force
            Start-Sleep -Seconds 2
          }
          & "$app\vd.exe" settings --language en | Out-Null
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rq --cached .
          git add -f screenshots/*.png
          git commit -qm "Screenshots for ${{ github.sha }}"
          git push -qf origin ci-screenshots

      - name: Test uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:LOCALAPPDATA "Programs\mp4-downloader"
          $p = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          Start-Sleep -Seconds 3
          if (Test-Path "$app\vd.exe") { throw "Uninstall did not remove vd.exe" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ";") -contains $app) { throw "PATH entry not removed" }
          Write-Host "Installer test passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mp4-downloader-setup
          path: dist/mp4-downloader-setup.exe

      - name: Attach installer to release
        if: needs.prepare-release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "dist/mp4-downloader-setup.exe" --clobber

  unix:
    # Linux and macOS install with install.sh (one command), so no files are published for them.
    name: Install test ${{ matrix.label }}
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install, test and uninstall
        env:
          VD_PACKAGE: ${{ github.workspace }}
        run: |
          set -e
          bash install.sh
          export PATH="$HOME/.local/bin:$PATH"
          vd --version
          vd selftest
          test -x "$HOME/.local/bin/vd-gui"
          if [ "$(uname -s)" = "Darwin" ]; then
            test -x "$HOME/Applications/Video Downloader.app/Contents/MacOS/video-downloader"
          else
            grep -q "Name=Video Downloader" "$HOME/.local/share/applications/mp4-downloader.desktop"
          fi
          bash uninstall.sh
          test ! -e "$HOME/.local/bin/vd"
          test ! -e "$HOME/.local/share/applications/mp4-downloader.desktop"
          test ! -e "$HOME/Applications/Video Downloader.app"
          echo "Install test passed."
